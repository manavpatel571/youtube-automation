[project]
name = "auto-video"
version = "1.0.0"
description = "Automated YouTube Shorts pipeline for AI/Tech news"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.9.0",
    "elevenlabs>=1.0.0",
    "moviepy>=2.0.0",
    "Pillow>=10.0.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "icrawler",
]

[project.scripts]
auto-video = "main:main"
